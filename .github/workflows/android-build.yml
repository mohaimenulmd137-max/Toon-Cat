name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build output type"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - debug
          - release

jobs:
  build:
    name: Build ToonMotion Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment & debug keystore
        run: |
          chmod +x gradlew
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" --no-daemon

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ToonMotion-Studio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare Release Keystore
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No release keystore secrets found; generating temporary CI keystore for release build."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass ci_store_pass_123 \
              -keypass ci_store_pass_123 \
              -dname "CN=ToonMotion Studio, OU=CI, O=ToonMotion, L=Cloud, S=CA, C=US"
            echo "STORE_PASSWORD=ci_store_pass_123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ci_store_pass_123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Release APK & AAB
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: ToonMotion-Studio-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: ToonMotion-Studio-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
